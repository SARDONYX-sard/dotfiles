[workspace]
resolver = "3"
members  = ["crates/*", "xtask"]

# Release version of `dot` (dot_cli). Internal crates stay at 0.0.0.
[workspace.package]
version = "0.1.0"
edition = "2024"

# Every dependency is declared once here; crates use `name.workspace = true`
# (and may add features locally).
[workspace.dependencies]
# internal
dot_core     = { path = "crates/dot_core" }
dot_prompt   = { path = "crates/dot_prompt" }
dot_shellgen = { path = "crates/dot_shellgen" }
dot_tui      = { path = "crates/dot_tui" }

# external
anyhow     = "1.0.105"
clap       = { version = "4.6.10", features = ["derive", "env"] }
dirs       = "7.0.0"
ignore     = "0.4.35"
indexmap   = "2.14.2"
jiff       = "1.0.3"
ratatui    = "0.30.2"
rayon      = "1.12.0"
schemars   = "1.2.3"
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml       = "1.2.3"
toml_edit  = "0.25.21"
which      = "8.0.6"

[profile.release]
lto           = true
codegen-units = 1
strip         = true
