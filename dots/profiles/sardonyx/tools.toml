[install.apt]
via      = "apt"
packages = ["fd-find", "fzf", "zoxide", "neovim", "vim", "fish", "shellcheck", "git", "make", "gcc", "python3"]

# [upgrade] / [clean]: run in file order by `dot upgrade` / `dot clean`. Entry forms:
#   name = "command"  |  name = ["cmd1", "cmd2"]
#   name = { cmd = "..." | [...], paths = [...], requires = "...", unless = "...", os = [...] }
# Skipped when the program (first word, ignoring `sudo`) or `requires` is missing.
# Commands run without a shell: no pipes, globbing or quoting.
