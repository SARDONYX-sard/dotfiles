#:schema ../../schemas/tools.schema.json
# Merged over dots/core/tools.toml (tables merge, values replace).
# Everything installed on SARDONYX's machines as of 2026-11-26.
# `scoop_buckets` and `apt` replace the base lists (arrays are replaced, not merged).

[install.scoop_buckets]
via      = "scoop_bucket"
packages = ["extras", "versions", "java", "jp"]

[install.scoop_global]
via      = "scoop_global"
packages = ["git", "7zip-dark"]

# Used by shared.toml (aliases, prompt, fzf, zoxide, ...).

[install.cli]
via = "scoop"
packages = [
  "7zip",
  "aria2",
  "delta",
  "difftastic",
  "dog",
  "duf",
  "dust",
  "gping",
  "sed",
  "tre-command",
  "xh",
  "yq",
  "zstd",
]

[install.dev]
via = "scoop"
packages = [
  "act",
  "ctags",
  "direnv",
  "dive",
  "gh",
  "git-filter-repo",
  "gitui",
  "gpg4win",
  "hadolint",
  "hyperfine",
  "lazydocker",
  "OpenSSH",
  "shellcheck",
  "shfmt",
  "tokei",
  "dockercompletion",
]

[install.editors]
via      = "scoop"
packages = ["neovim", "neovide", "vim-kaoriya"]

[install.langs]
via = "scoop"
